[package]
name = "trtx"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Safe Rust bindings to NVIDIA TensorRT-RTX (EXPERIMENTAL - NOT FOR PRODUCTION)"
readme = "../README.md"
keywords = ["tensorrt", "inference", "deep-learning", "nvidia", "gpu"]
categories = ["api-bindings", "science"]

[features]
default = ["trtx-sys-dep", "cxx-dep", "libc-dep"]
# Mock mode for development without TensorRT-RTX installed  
mock = []

# Internal features (don't use directly)
trtx-sys-dep = ["dep:trtx-sys"]
cxx-dep = ["dep:cxx"]
libc-dep = ["dep:libc"]

[dependencies]
thiserror = "2.0"
trtx-sys = { version = "0.2.0", path = "../trtx-sys", optional = true }
cxx = { version = "1.0", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
# For examples and tests
